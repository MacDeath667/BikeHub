<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f4" />
    <script>
      // Resolve before styles and React load, so a saved dark theme never flashes white.
      (() => {
        let preference;
        try { preference = localStorage.getItem("bikehub.theme"); } catch {}
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#111a16" : "#f6f7f4";
      })();
    </script>
    <meta
      name="description"
      content="BikeHub — велосипеды, их владельцы и истории. Ведите бортжурнал, делитесь опытом и находите своих."
    />
    <title>BikeHub — у каждого велосипеда своя история</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
