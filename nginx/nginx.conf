events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream bikehub {
        zone bikehub 64k;
        server bikehub.api:8080 resolve;
    }
    upstream frontend {
        zone frontend 64k;
        server web:80 resolve;
    }
    server {
        listen 80;
        location /api/ { proxy_pass http://bikehub; proxy_set_header Host $host; }
        location = /api { proxy_pass http://bikehub; }
        location /swagger { proxy_pass http://bikehub; }
        location / { proxy_pass http://frontend; proxy_set_header Host $host; }
    }
}
