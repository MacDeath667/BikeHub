name: Build and test

on:
  push:
    branches: [main, master, 'engineering/**', 'frontend/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and persistence tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BikeHub.sln --disable-parallel
      - name: Build with repository analyzers
        run: dotnet build BikeHub.sln -c Release --no-restore --disable-build-servers -m:1
      - name: Test with isolated PostgreSQL and Kafka containers
        run: dotnet test BikeHub.sln -c Release --no-build --no-restore --disable-build-servers -m:1 --logger 'console;verbosity=normal'

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci --prefix Web --no-audit --no-fund
      - run: npm test --prefix Web
      - run: npm run build --prefix Web

  operator-tools:
    name: Operator tools container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build operator image and check its runtime without network
        run: |
          docker build --tag bikehub-tools:ci --file tools/BikeHub.Tools/Dockerfile .
          docker run --rm --network=none bikehub-tools:ci --help
      - name: Export synthetic PostgreSQL credentials through stdin without network
        run: |
          operator_fixture_directory="$(mktemp -d)"
          trap 'sudo rm -rf -- "$operator_fixture_directory"' EXIT
          printf '%s' 'Host=localhost;Username=backup;Database=fixture;Password=fake-ci-only-password;SSL Mode=Disable' |
            docker run --rm --interactive --network=none --user=0 --read-only --env DOTNET_EnableDiagnostics=0 --mount "type=bind,source=$operator_fixture_directory,target=/config" bikehub-tools:ci backup-pg --directory /config/api
          docker run --rm --network=none --user=0 --read-only --entrypoint=/bin/sh --mount "type=bind,source=$operator_fixture_directory,target=/config,readonly" bikehub-tools:ci -ec 'test "$(stat -c %a /config/api)" = 700; test "$(stat -c %a /config/api/passwords)" = 600; test "$(stat -c %a /config/api/connection)" = 600; ! grep -Fq fake-ci-only-password /config/api/connection'

  infrastructure:
    name: Infrastructure isolation and configuration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Ansible
        run: pipx install 'ansible-core>=2.21,<2.22'
      - name: Install declared collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Test source packaging, staging isolation and mail configuration
        run: |
          ansible-playbook infra/tests/package-source.yml
          ansible-playbook infra/tests/staging.yml
          ansible-playbook infra/tests/auth-mode.yml
          ansible-playbook infra/tests/configure-mail.yml
          ansible-playbook infra/tests/backup-preflight.yml
          ansible-playbook infra/tests/backup-restore.yml
          ansible-playbook --syntax-check infra/ansible/playbooks/backup-local.yml
          ansible-playbook --syntax-check infra/ansible/playbooks/restore-check-local.yml
          ansible-playbook --syntax-check infra/ansible/playbooks/backup-nas.yml
          ansible-playbook --syntax-check infra/ansible/playbooks/resume-backup-nas.yml
          ansible-playbook --syntax-check infra/ansible/playbooks/restore-check-nas.yml
