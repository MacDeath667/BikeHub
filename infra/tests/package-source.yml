---
- name: Verify the source archive without connecting to a VM
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Allocate an isolated fixture
      ansible.builtin.tempfile:
        state: directory
        prefix: bikehub-package-test-
      register: fixture

    - name: Exercise archive contents and content hashing
      block:
        - name: Select fixture as the source tree
          ansible.builtin.set_fact:
            bikehub_source_dir: "{{ fixture.path }}/infra/.."

        - name: Create source and excluded fixture directories
          ansible.builtin.file:
            path: "{{ fixture.path }}/{{ item }}"
            state: directory
          loop: [src/BikeHub.Api, src/BikeHub.Api/obj, src/BikeHub.Api/App_Data/auth/keys, Web/src, Web/node_modules, Web/dist, infra, tools/BikeHub.Tools, tools/BikeHub.Tools/obj]

        - name: Write source and excluded fixture files
          ansible.builtin.copy:
            dest: "{{ fixture.path }}/{{ item }}"
            content: fixture
          loop: [.dockerignore, .editorconfig, Directory.Build.props, src/BikeHub.Api/Program.cs, src/BikeHub.Api/obj/cache, src/BikeHub.Api/App_Data/auth/keys/test-key.xml, Web/package.json, Web/src/main.tsx, Web/.env.local, Web/node_modules/private, Web/dist/index.html, infra/vault.yml, tools/BikeHub.Tools/Program.cs, tools/BikeHub.Tools/BikeHub.Tools.csproj, tools/BikeHub.Tools/Dockerfile, tools/BikeHub.Tools/obj/cache, tools/BikeHub.Tools/client_secret_test.json, tools/BikeHub.Tools/gmail-oauth-test.json]

        - name: Package fixture with the actual deployment tasks
          ansible.builtin.include_tasks: ../ansible/tasks/package-source.yml

        - name: Remember the first content digest
          ansible.builtin.set_fact:
            first_digest: "{{ bikehub_source_digest }}"
            first_archive: "{{ bikehub_source_archive.path }}"

        - name: List archive members
          ansible.builtin.command:
            argv: [tar, -tzf, "{{ bikehub_source_archive.path }}"]
          register: members
          changed_when: false

        - name: Check source paths and exclusions
          ansible.builtin.assert:
            that:
              - "'Web/package.json' in members.stdout_lines"
              - "'src/BikeHub.Api/Program.cs' in members.stdout_lines"
              - "'.editorconfig' in members.stdout_lines"
              - members.stdout is not search('node_modules|/obj/|/dist/|/App_Data/|[.]env|infra/|[.][.]/')
              - members.stdout is not search('tools/')

        - name: Change only file timestamps
          ansible.builtin.file:
            path: "{{ fixture.path }}/Web/package.json"
            state: touch

        - name: Package the timestamp-only change
          ansible.builtin.include_tasks: ../ansible/tasks/package-source.yml

        - name: Require a stable content digest
          ansible.builtin.assert:
            that: bikehub_source_digest == first_digest

        - name: Enable tools only for an operator image build
          ansible.builtin.set_fact:
            second_archive: "{{ bikehub_source_archive.path }}"
            bikehub_package_tools: true

        - name: Package operator sources with the actual tasks
          ansible.builtin.include_tasks: ../ansible/tasks/package-source.yml

        - name: Inspect operator archive members
          ansible.builtin.command:
            argv: [tar, -tzf, "{{ bikehub_source_archive.path }}"]
          register: operator_members
          changed_when: false

        - name: Include real operator sources without generated files or OAuth credentials
          ansible.builtin.assert:
            that:
              - "'tools/BikeHub.Tools/Program.cs' in operator_members.stdout_lines"
              - "'tools/BikeHub.Tools/Dockerfile' in operator_members.stdout_lines"
              - operator_members.stdout is not search('node_modules|/obj/|/dist/|/App_Data/|[.]env|infra/|client_secret|gmail-oauth')
              - bikehub_source_digest != first_digest
      always:
        - name: Remove test archives
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ [first_archive | default(''), second_archive | default(''), bikehub_source_archive.path | default('')] | reject('equalto', '') | unique | list }}"

        - name: Remove only the isolated fixture
          ansible.builtin.file:
            path: "{{ fixture.path }}"
            state: absent
