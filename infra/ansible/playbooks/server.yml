---
- name: Deploy BikeHub on the existing single-node K3s host
  hosts: "{{ bikehub_target_group | default('bikehub') }}"
  become: true
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/bikehub/main.yml

  pre_tasks:
    - name: Validate target and deployment settings before connecting
      ansible.builtin.assert:
        that:
          - ansible_host | default('') | length > 0
          - bikehub_remote_root is match('^/opt/[A-Za-z0-9_-]+$')
          - bikehub_replica_count | int > 0
          - bikehub_auth_enabled is none or bikehub_auth_enabled | bool == false or (bikehub_database_enabled | bool and bikehub_tls_enabled | bool and bikehub_mail_enabled | bool)
          - bikehub_mail_secret_name is match('^[a-z0-9][a-z0-9-]*$')
          - bikehub_mail_database_secret_name is match('^[a-z0-9][a-z0-9-]*$')
          - bikehub_mail_topic is match('^[A-Za-z0-9._-]+$')
          - bikehub_mail_image | length == 0 or bikehub_mail_image is match('^[A-Za-z0-9./_:@-]+$')
          - bikehub_mail_image_repository is match('^[A-Za-z0-9./_:-]+$')
          - bikehub_auth_secret_name is match('^[a-z0-9][a-z0-9-]*$')
          - bikehub_auth_key_claim is match('^[a-z0-9][a-z0-9-]*$')
          - bikehub_app_port | int > 0 and bikehub_app_port | int < 65536
          - bikehub_node_port | int >= 30000 and bikehub_node_port | int <= 32767
          - bikehub_image | length == 0 or bikehub_image is match('^[A-Za-z0-9./_:@-]+$')
          - bikehub_image_repository is match('^[A-Za-z0-9./_:-]+$')
          - bikehub_truenas_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - bikehub_truenas_ip is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
        fail_msg: Set BIKEHUB_VM_IP to the existing VM address and review the deployment variables.
      delegate_to: localhost
      become: false

    - name: Wait for SSH on the existing VM
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Gather guest facts
      ansible.builtin.setup:

    - name: Resolve authentication mode while preserving the deployed setting
      ansible.builtin.import_tasks: ../tasks/auth-mode.yml

    - name: Select a unique migration Job name
      ansible.builtin.set_fact:
        bikehub_migration_job_name: "bikehub-db-migrate-{{ ansible_facts.date_time.epoch }}"

  tasks:
    - name: Install host services and the container builder
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - nginx
          - docker.io
          - curl
          - ca-certificates
          - systemd-timesyncd
          - openssl
          - python3
          - diffutils
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable host services and network time synchronization
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [qemu-guest-agent, docker, systemd-timesyncd]

    - name: Keep the guest hardware clock in UTC
      ansible.builtin.command:
        argv: [timedatectl, set-local-rtc, "0"]
      changed_when: false

    - name: Wait for the clock to synchronize before touching K3s certificates
      ansible.builtin.command:
        argv: [timedatectl, show, --property=NTPSynchronized, --value]
      register: bikehub_time_sync
      until: bikehub_time_sync.stdout == 'yes'
      retries: 30
      delay: 2
      changed_when: false

    - name: Check whether K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: bikehub_k3s_binary

    - name: Download the K3s installer only for a new installation
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/sbin/install-k3s
        owner: root
        group: root
        mode: "0755"
        validate_certs: true
      when: not bikehub_k3s_binary.stat.exists

    - name: Create K3s configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: [/etc/rancher/k3s, /etc/systemd/system/k3s.service.d]

    - name: Configure K3s without Traefik and with encrypted Secrets
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          disable:
            - traefik
          write-kubeconfig-mode: "0600"
          secrets-encryption: true
      register: k3s_config

    - name: Start K3s only after network time has synchronized
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/10-time-sync.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Wants=systemd-time-wait-sync.service
          After=systemd-time-wait-sync.service
      register: k3s_time_ordering

    - name: Install K3s only when it is absent
      ansible.builtin.command:
        argv: [/usr/local/sbin/install-k3s]
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_CHANNEL: "{{ bikehub_k3s_channel }}"
        INSTALL_K3S_EXEC: server

    - name: Reload systemd when K3s boot ordering changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: k3s_time_ordering.changed

    - name: Recover certificates issued before a backwards clock correction
      when: bikehub_rotate_k3s_certificates | bool
      block:
        - name: Stop K3s before rotating leaf certificates
          ansible.builtin.service:
            name: k3s
            state: stopped

        - name: Rotate K3s leaf certificates while preserving the cluster CA
          ansible.builtin.command:
            argv: [k3s, certificate, rotate]
          changed_when: true
      always:
        - name: Bring K3s back after certificate recovery
          ansible.builtin.service:
            name: k3s
            enabled: true
            state: started

    - name: Restart K3s for changed configuration
      ansible.builtin.service:
        name: k3s
        state: restarted
      when:
        - k3s_config.changed or k3s_time_ordering.changed
        - not (bikehub_rotate_k3s_certificates | bool)

    - name: Enable and start K3s
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: started

    - name: Wait for the Kubernetes node
      ansible.builtin.command:
        argv: [k3s, kubectl, wait, --for=condition=Ready, node, --all, --timeout=180s]
      changed_when: false

    - name: Refresh system pod credentials issued before the clock correction
      ansible.builtin.command:
        argv: [k3s, kubectl, rollout, restart, deployment/coredns, deployment/local-path-provisioner, deployment/metrics-server, -n, kube-system]
      changed_when: true
      when: bikehub_rotate_k3s_certificates | bool

    - name: Build or reuse the application image
      ansible.builtin.import_tasks: ../tasks/source.yml

    - name: Publish the local website name
      ansible.builtin.import_tasks: ../tasks/mdns.yml

    - name: Create the Kubernetes resource directory
      ansible.builtin.file:
        path: "{{ bikehub_remote_root }}/k8s"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render public Kubernetes resources
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ item }}.j2"
        dest: "{{ bikehub_remote_root }}/k8s/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [namespace.yml, coredns.yml]

    - name: Apply the namespace
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, -f, "{{ bikehub_remote_root }}/k8s/namespace.yml"]
      register: namespace_apply
      changed_when: "'configured' in namespace_apply.stdout or 'created' in namespace_apply.stdout"

    - name: Check whether the managed CoreDNS zone differs
      ansible.builtin.command:
        argv: [k3s, kubectl, diff, --server-side, --field-manager=bikehub-dns, -f, "{{ bikehub_remote_root }}/k8s/coredns.yml"]
      register: coredns_diff
      changed_when: false
      failed_when: coredns_diff.rc not in [0, 1]

    - name: Merge the TrueNAS zone into the K3s custom DNS ConfigMap
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, --server-side, --field-manager=bikehub-dns, -f, "{{ bikehub_remote_root }}/k8s/coredns.yml"]
      register: coredns_apply
      changed_when: coredns_diff.rc == 1

    - name: Reload CoreDNS for the configured TrueNAS zone
      ansible.builtin.command:
        argv: [k3s, kubectl, rollout, restart, deployment/coredns, -n, kube-system]
      changed_when: true
      when: coredns_apply.changed

    - name: Wait for CoreDNS
      ansible.builtin.command:
        argv: [k3s, kubectl, rollout, status, deployment/coredns, -n, kube-system, --timeout=180s]
      changed_when: false

    - name: Configure telemetry collection and storage
      ansible.builtin.import_tasks: ../tasks/observability.yml
      when: bikehub_observability_enabled | bool

    - name: Apply database credentials if provided and run migrations
      ansible.builtin.import_tasks: ../tasks/database.yml
      when: bikehub_database_enabled | bool

    - name: Check authentication prerequisites without reading credentials
      ansible.builtin.import_tasks: ../tasks/authentication.yml
      when: bikehub_auth_enabled | bool

    - name: Deploy the mail service before updating its API client
      ansible.builtin.import_tasks: ../tasks/mail.yml
      when: bikehub_mail_enabled | bool

    - name: Render the independent frontend
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/web.yml.j2"
        dest: "{{ bikehub_remote_root }}/k8s/web.yml"
        mode: "0644"

    - name: Deploy the independent frontend
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, -f, "{{ bikehub_remote_root }}/k8s/web.yml"]
      register: bikehub_web_apply
      changed_when: "'configured' in bikehub_web_apply.stdout or 'created' in bikehub_web_apply.stdout"

    - name: Wait for the frontend
      ansible.builtin.command:
        argv: [k3s, kubectl, rollout, status, deployment/bikehub-web, -n, "{{ bikehub_namespace }}", --timeout=300s]
      changed_when: false

    - name: Configure nginx and the website certificate
      ansible.builtin.import_tasks: ../tasks/nginx.yml

    - name: Render the application with current Secret revisions
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/app.yml.j2"
        dest: "{{ bikehub_remote_root }}/k8s/app.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy BikeHub and its NodePort service
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, -f, "{{ bikehub_remote_root }}/k8s/app.yml"]
      register: app_apply
      changed_when: "'configured' in app_apply.stdout or 'created' in app_apply.stdout"

    - name: Wait for the application rollout
      ansible.builtin.command:
        argv: [k3s, kubectl, rollout, status, "deployment/{{ bikehub_deployment }}", -n, "{{ bikehub_namespace }}", --timeout=300s]
      changed_when: false

    - name: Verify the website endpoint
      ansible.builtin.import_tasks: ../tasks/verify-web.yml

    - name: Report the deployed application
      ansible.builtin.debug:
        msg:
          url: "{{ bikehub_public_url }}"
          image: "{{ bikehub_selected_image }}"
          replicas: "{{ bikehub_replica_count }}"
          api: "{{ bikehub_health.json }}"

    - name: Deploy the companion staging instance
      ansible.builtin.include_tasks: ../tasks/staging.yml
      when: bikehub_staging_enabled | bool and (bikehub_deploy_staging | default(true) | bool)
