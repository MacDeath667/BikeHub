---
- name: Enable vaulted password SSH for the Ansible account
  hosts: bikehub_bootstrap
  become: true
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/bikehub/vault.yml

  pre_tasks:
    - name: Require a vaulted Ansible SSH password
      ansible.builtin.assert:
        that:
          - vault_ansible_password is defined
          - vault_ansible_password | length >= 12
        fail_msg: Define vault_ansible_password (at least 12 characters) in the encrypted vault.yml.

  tasks:
    - name: Generate a SHA-512 password hash on the VM
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - passwd
          - -6
          - -stdin
        stdin: "{{ vault_ansible_password }}"
      register: ansible_password_hash
      changed_when: false
      no_log: true

    - name: Set the Ansible account password
      ansible.builtin.user:
        name: ansible
        password: "{{ ansible_password_hash.stdout }}"
        password_lock: false
      no_log: true

    - name: Allow SSH password authentication while keeping root SSH disabled
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-bikehub-password.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication yes
          PermitRootLogin no
      notify: Restart SSH

    - name: Remove the cloud-init password-authentication override
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-bikehub-hardening.conf
        state: absent
      notify: Restart SSH

    - name: Validate SSH server configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Apply SSH configuration now
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
