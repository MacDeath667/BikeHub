---
- name: Configure BikeHub telemetry storage and collection on the existing VM
  hosts: "{{ bikehub_target_group | default('bikehub') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Deploy the telemetry services
      ansible.builtin.import_tasks: ../tasks/observability.yml

    - name: Provision Grafana through Ansible templates and the TrueNAS API
      ansible.builtin.include_tasks: ../tasks/grafana.yml
      when: bikehub_grafana_provision_enabled | bool

    - name: Report the development OTLP endpoint
      ansible.builtin.debug:
        msg: "http://{{ bikehub_hostname }}:{{ bikehub_otlp_node_port }}"
