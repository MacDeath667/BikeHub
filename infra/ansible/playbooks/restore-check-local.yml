---
- name: Restore a local backup into isolated disposable resources
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    bikehub_backup_image: postgres:18.6
    bikehub_backup_sql: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/backup-table-counts.sql') }}"
    bikehub_backup_artifacts: [database.dump, tables.txt, media.tar.gz, media.sha256, auth.tar.gz, auth.sha256]
  tasks:
    - name: Require an explicit existing backup directory
      ansible.builtin.assert:
        that:
          - bikehub_backup_directory is defined
          - bikehub_backup_directory is abs
          - bikehub_backup_image is match('^[A-Za-z0-9./_:@-]+$')

    - name: Read the completed backup manifest
      ansible.builtin.slurp:
        src: "{{ bikehub_backup_directory }}/manifest.json"
      register: restore_manifest_file

    - name: Parse and validate the format before creating anything
      ansible.builtin.set_fact:
        restore_manifest: "{{ restore_manifest_file.content | b64decode | from_json }}"
        restore_resource: "bikehub-restore-{{ now(utc=true, fmt='%Y%m%d%H%M%S%f') }}"

    - name: Reject unknown manifests and incomplete artifact sets
      ansible.builtin.assert:
        that:
          - restore_manifest.formatVersion == 1
          - restore_manifest.source == 'local-compose'
          - restore_manifest.database == 'bikehub_local'
          - restore_manifest.artifacts.keys() | sort == bikehub_backup_artifacts | sort

    - name: Check every artifact before executing pg_restore
      ansible.builtin.stat:
        path: "{{ bikehub_backup_directory }}/{{ item }}"
        checksum_algorithm: sha256
      loop: "{{ bikehub_backup_artifacts }}"
      register: restore_checksums

    - name: Refuse damaged or missing backup files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.checksum | default('') == restore_manifest.artifacts[item.item]
      loop: "{{ restore_checksums.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Exercise restore without source volumes, networks or application services
      block:
        - name: Create a disposable database with no network and no exposed ports
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --detach
              - --name
              - "{{ restore_resource }}"
              - --network=none
              - --mount
              - "type=volume,source={{ restore_resource }}-database,target=/var/lib/postgresql"
              - --mount
              - "type=bind,source={{ bikehub_backup_directory }},target=/backup,readonly"
              - --env=POSTGRES_USER=restore_check
              - --env=POSTGRES_DB=bikehub_restore_check
              - --env=POSTGRES_HOST_AUTH_METHOD=trust
              - "{{ bikehub_backup_image }}"

        - name: Wait for the disposable database
          ansible.builtin.command:
            argv: [docker, exec, "{{ restore_resource }}", pg_isready, --username=restore_check, --dbname=bikehub_restore_check]
          register: restore_ready
          until: restore_ready.rc == 0
          retries: 30
          delay: 2
          changed_when: false

        - name: Restore using the local container socket only
          ansible.builtin.command:
            argv: [docker, exec, "{{ restore_resource }}", pg_restore, --username=restore_check, --dbname=bikehub_restore_check, --no-owner, --no-acl, --exit-on-error, --single-transaction, /backup/database.dump]
          no_log: true

        - name: Recount all restored application tables
          ansible.builtin.command:
            argv: [docker, exec, --interactive, "{{ restore_resource }}", psql, --username=restore_check, --dbname=bikehub_restore_check, --no-psqlrc, --tuples-only, --no-align, --set=ON_ERROR_STOP=1]
            stdin: "{{ bikehub_backup_sql }}"
          register: restore_table_counts
          changed_when: false

        - name: Compare restored row counts with the quiesced source
          ansible.builtin.assert:
            that:
              - restore_table_counts.stdout | trim == lookup('ansible.builtin.file', bikehub_backup_directory ~ '/tables.txt') | trim

        - name: Extract archives into disposable volumes and verify every file byte
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network=none
              - --read-only
              - --mount
              - "type=volume,source={{ restore_resource }}-{{ item }},target=/restore"
              - --mount
              - "type=bind,source={{ bikehub_backup_directory }},target=/backup,readonly"
              - --entrypoint=/bin/sh
              - "{{ bikehub_backup_image }}"
              - -ec
              - "cd /restore; tar -xzf /backup/{{ item }}.tar.gz --no-same-owner; if [ -s /backup/{{ item }}.sha256 ]; then sha256sum --check --status /backup/{{ item }}.sha256; fi"
          loop: [media, auth]
          no_log: true

        - name: Report verified recovery without printing account or key data
          ansible.builtin.debug:
            msg: Restored database row counts, media files and session keys match the source snapshot. Original volumes and database were never mounted or modified.
      always:
        - name: Remove only this run's disposable database container
          ansible.builtin.command:
            argv: [docker, rm, --force, --volumes, "{{ restore_resource }}"]
          register: restore_container_cleanup
          failed_when: restore_container_cleanup.rc != 0 and 'No such container' not in restore_container_cleanup.stderr
          changed_when: restore_container_cleanup.rc == 0

        - name: Remove only this run's disposable volumes
          ansible.builtin.command:
            argv: [docker, volume, rm, "{{ restore_resource }}-{{ item }}"]
          loop: [database, media, auth]
          register: restore_volume_cleanup
          failed_when: restore_volume_cleanup.rc != 0 and 'no such volume' not in restore_volume_cleanup.stderr | lower
          changed_when: restore_volume_cleanup.rc == 0
