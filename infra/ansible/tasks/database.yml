---
- name: Update the database Secret only when credentials are supplied
  when: bikehub_database_connection_string is defined
  block:
    - name: Validate supplied database credentials
      ansible.builtin.assert:
        that:
          - bikehub_database_connection_string | length > 0
      no_log: true

    - name: Render the database Secret
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/database-secret.yml.j2"
        dest: "{{ bikehub_remote_root }}/k8s/database-secret.yml"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Apply the database Secret
      ansible.builtin.command:
        argv: [k3s, kubectl, apply, -f, "{{ bikehub_remote_root }}/k8s/database-secret.yml"]
      no_log: true
  always:
    - name: Remove the temporary plaintext Secret manifest
      ansible.builtin.file:
        path: "{{ bikehub_remote_root }}/k8s/database-secret.yml"
        state: absent
      no_log: true

- name: Require the supplied or already existing database Secret
  ansible.builtin.command:
    argv: [k3s, kubectl, get, secret/bikehub-database, -n, "{{ bikehub_namespace }}", -o, name]
  changed_when: false

- name: Read the Secret revision without exposing its contents
  ansible.builtin.command:
    argv: [k3s, kubectl, get, secret/bikehub-database, -n, "{{ bikehub_namespace }}", -o, "jsonpath={.metadata.resourceVersion}"]
  register: bikehub_database_secret_version
  changed_when: false

- name: Render the migration Job
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/migration-job.yml.j2"
    dest: "{{ bikehub_remote_root }}/k8s/migration-job.yml"
    owner: root
    group: root
    mode: "0644"

- name: Run migrations before updating the application
  ansible.builtin.command:
    argv: [k3s, kubectl, apply, -f, "{{ bikehub_remote_root }}/k8s/migration-job.yml"]
  register: migration_apply
  changed_when: "'configured' in migration_apply.stdout or 'created' in migration_apply.stdout"

- name: Wait for migrations
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - wait
      - --for=condition=complete
      - "job/{{ bikehub_migration_job_name }}"
      - -n
      - "{{ bikehub_namespace }}"
      - "--timeout={{ bikehub_migration_timeout }}s"
  changed_when: false
