---
- name: Package and build the current API and Web sources
  when: bikehub_rebuild_image | bool
  block:
    - name: Package the current working tree with Ansible
      ansible.builtin.include_tasks: package-source.yml

    - name: Select the immutable image tag for this source archive
      ansible.builtin.set_fact:
        bikehub_selected_image: >-
          {{ bikehub_image if bikehub_image | length > 0 else
             bikehub_image_repository ~ ':build-' ~ bikehub_source_digest[:16] }}
        bikehub_selected_mail_image: >-
          {{ bikehub_mail_image if bikehub_mail_image | length > 0 else
             bikehub_mail_image_repository ~ ':build-' ~ bikehub_source_digest[:16] }}

    - name: Remove only the managed Docker build context
      ansible.builtin.file:
        path: "{{ bikehub_remote_root }}/build"
        state: absent

    - name: Create a fresh Docker build context
      ansible.builtin.file:
        path: "{{ bikehub_remote_root }}/build"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Transfer and unpack API and Web sources
      ansible.builtin.unarchive:
        src: "{{ bikehub_source_archive.path }}"
        dest: "{{ bikehub_remote_root }}/build"
        owner: root
        group: root
        mode: "u=rwX,g=rX,o=rX"

    - name: Build the BikeHub application container
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --tag
          - "{{ bikehub_selected_image }}"
          - --file
          - src/BikeHub.Api/Dockerfile
          - .
        chdir: "{{ bikehub_remote_root }}/build"
      changed_when: true

    - name: Import the application image into K3s containerd
      ansible.builtin.shell: |
        set -o pipefail
        docker save {{ bikehub_selected_image | quote }} | k3s ctr images import -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Build the mail service container
      ansible.builtin.command:
        argv: [docker, build, --tag, "{{ bikehub_selected_mail_image }}", --file, src/BikeHub.Mail/Dockerfile, .]
        chdir: "{{ bikehub_remote_root }}/build"
      when: bikehub_mail_enabled | bool
      changed_when: true

    - name: Import the mail image into K3s containerd
      ansible.builtin.shell: |
        set -o pipefail
        docker save {{ bikehub_selected_mail_image | quote }} | k3s ctr images import -
      args:
        executable: /bin/bash
      when: bikehub_mail_enabled | bool
      changed_when: true
  always:
    - name: Remove the controller's temporary source archive
      ansible.builtin.file:
        path: "{{ bikehub_source_archive.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: bikehub_source_archive.path is defined

- name: Reuse an explicitly selected or currently deployed image
  when: not (bikehub_rebuild_image | bool)
  block:
    - name: Read the currently deployed image
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - "deployment/{{ bikehub_image_deployment | default(bikehub_deployment) }}"
          - -n
          - "{{ bikehub_namespace }}"
          - -o
          - "jsonpath={.spec.template.spec.containers[0].image}"
      register: bikehub_current_image
      changed_when: false
      failed_when: false
      when: bikehub_image | length == 0

    - name: Require an existing image when skipping the build
      ansible.builtin.assert:
        that:
          - bikehub_image | length > 0 or (bikehub_current_image.rc == 0 and bikehub_current_image.stdout | length > 0)
        fail_msg: First deployment requires a build. Otherwise set bikehub_image to a tag already imported into K3s.

    - name: Select the image to reuse
      ansible.builtin.set_fact:
        bikehub_selected_image: "{{ bikehub_image if bikehub_image | length > 0 else bikehub_current_image.stdout }}"

    - name: Read the deployed mail image when skipping builds
      ansible.builtin.command:
        argv: [k3s, kubectl, get, "deployment/{{ bikehub_mail_image_deployment | default('bikehub-mail') }}", -n, "{{ bikehub_namespace }}", -o, 'jsonpath={.spec.template.spec.containers[0].image}']
      when: bikehub_mail_enabled | bool and bikehub_mail_image | length == 0
      register: bikehub_current_mail_image
      changed_when: false

    - name: Select the mail image to reuse
      ansible.builtin.set_fact:
        bikehub_selected_mail_image: "{{ bikehub_mail_image if bikehub_mail_image | length > 0 else bikehub_current_mail_image.stdout }}"
      when: bikehub_mail_enabled | bool

- name: Verify the mail image is available to Kubernetes
  ansible.builtin.command:
    argv: [k3s, crictl, inspecti, "{{ bikehub_selected_mail_image }}"]
  when: bikehub_mail_enabled | bool
  changed_when: false
  no_log: true

- name: Verify the selected image is available to the Kubernetes runtime
  ansible.builtin.command:
    argv: [k3s, crictl, inspecti, "{{ bikehub_selected_image }}"]
  changed_when: false
  no_log: true
