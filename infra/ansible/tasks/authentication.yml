---
- name: Require the separately managed email and OTP Secret
  ansible.builtin.command:
    argv: [k3s, kubectl, get, "secret/{{ bikehub_auth_secret_name }}", -n, "{{ bikehub_namespace }}", -o, name]
  changed_when: false

- name: Read the email transport selection without reading credentials
  ansible.builtin.command:
    argv: [k3s, kubectl, get, "secret/{{ bikehub_auth_secret_name }}", -n, "{{ bikehub_namespace }}", -o, 'jsonpath={.metadata.annotations.bikehub\.io/email-provider}']
  register: bikehub_mail_provider_annotation
  changed_when: false

- name: Select the configured email provider
  ansible.builtin.set_fact:
    bikehub_effective_email_provider: "{{ bikehub_mail_provider_annotation.stdout | default('Smtp', true) }}"

- name: Validate the selected email provider
  ansible.builtin.assert:
    that:
      - bikehub_effective_email_provider in ['Smtp', 'GmailApi']
    fail_msg: Configure the email provider through the BikeHub setup scripts.

- name: Read the authentication Secret revision without exposing its contents
  ansible.builtin.command:
    argv: [k3s, kubectl, get, "secret/{{ bikehub_auth_secret_name }}", -n, "{{ bikehub_namespace }}", -o, "jsonpath={.metadata.resourceVersion}"]
  register: bikehub_auth_secret_version
  changed_when: false

- name: Render persistent storage for cookie encryption keys
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/auth-keys.yml.j2"
    dest: "{{ bikehub_remote_root }}/k8s/auth-keys.yml"
    owner: root
    group: root
    mode: "0644"

- name: Preserve cookie keys across application restarts
  ansible.builtin.command:
    argv: [k3s, kubectl, apply, -f, "{{ bikehub_remote_root }}/k8s/auth-keys.yml"]
  register: auth_keys_apply
  changed_when: "'configured' in auth_keys_apply.stdout or 'created' in auth_keys_apply.stdout"
