---
- name: Validate the Grafana provisioning target
  ansible.builtin.assert:
    that:
      - bikehub_grafana_ssh_target is match('^[A-Za-z0-9_-]+@[A-Za-z0-9.-]+$')
      - bikehub_grafana_truenas_url is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$')
      - bikehub_grafana_app_name is match('^[a-z0-9][a-z0-9-]*$')

- name: Register the TrueNAS SSH target
  ansible.builtin.add_host:
    name: bikehub-grafana-truenas
    ansible_host: "{{ bikehub_grafana_ssh_target.split('@')[1] }}"
    ansible_user: "{{ bikehub_grafana_ssh_target.split('@')[0] }}"
    ansible_ssh_private_key_file: "{{ bikehub_grafana_ssh_identity }}"
    ansible_python_interpreter: /usr/bin/python3

- name: Render provisioning and call the TrueNAS 25.10 API adapter
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../observability/truenas-provision.py') }}"
    stdin: >-
      {{ {'app': bikehub_grafana_app_name,
          'certificate_id': bikehub_grafana_certificate_id | int,
          'api_url': bikehub_grafana_truenas_url,
          'ca_certificate': lookup('ansible.builtin.file', bikehub_grafana_ca_certificate),
          'files': {
            'datasources/bikehub.yml': lookup('ansible.builtin.template', playbook_dir ~ '/../templates/grafana-datasources.yml.j2'),
            'dashboards/bikehub.yml': lookup('ansible.builtin.template', playbook_dir ~ '/../templates/grafana-provider.yml.j2'),
            'dashboards-json/bikehub-api.json': lookup('ansible.builtin.file', playbook_dir ~ '/../../observability/dashboards/bikehub-api.json')
          }} | to_json }}
  delegate_to: bikehub-grafana-truenas
  become: false
  register: bikehub_grafana_provision
  changed_when: (bikehub_grafana_provision.stdout | from_json).changed
