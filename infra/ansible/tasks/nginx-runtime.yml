---
- name: Ensure nginx workers own the runtime buffer directories
  ansible.builtin.file:
    path: "/var/lib/nginx/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "u=rwX,g=,o="
    recurse: true
  loop: [body, proxy, fastcgi, scgi, uwsgi]

- name: Install the isolated nginx fragment validator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/validate-nginx-site.sh"
    dest: /usr/local/sbin/validate-bikehub-nginx
    owner: root
    group: root
    mode: "0755"
