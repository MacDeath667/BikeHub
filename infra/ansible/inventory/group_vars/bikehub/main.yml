---
bikehub_app_port: 8080
bikehub_node_port: 30080
bikehub_hostname: bikehub.local
bikehub_replica_count: 1
bikehub_rebuild_image: true
bikehub_image_repository: docker.io/library/bikehub-api
# Leave empty to tag a build by its source hash, or reuse the deployed image when not rebuilding.
bikehub_image: ""
bikehub_mail_enabled: true
bikehub_mail_image: ""
bikehub_mail_image_repository: docker.io/library/bikehub-mail
bikehub_mail_database_secret_name: bikehub-database
bikehub_mail_secret_name: bikehub-mail
bikehub_mail_kafka_enabled: true
bikehub_mail_kafka_managed: true
bikehub_mail_kafka_servers: bikehub-kafka:9092
bikehub_mail_topic: bikehub.mail.send.v1
bikehub_kafka_image: apache/kafka:4.0.2
bikehub_source_dir: "{{ playbook_dir }}/../../.."
bikehub_remote_root: /opt/bikehub
bikehub_namespace: bikehub
bikehub_deployment: bikehub-api
bikehub_database_enabled: true
bikehub_database_bootstrap_enabled: true
# Preserve the deployed mode; a new installation defaults to disabled.
# Explicit true/false overrides it for this deployment.
bikehub_auth_enabled: null
bikehub_auth_secret_name: bikehub-auth
bikehub_auth_key_claim: bikehub-auth-keys
bikehub_migration_timeout: 300
bikehub_migration_retention: 86400
bikehub_truenas_hostname: truenas.local
bikehub_truenas_ip: "{{ lookup('ansible.builtin.env', 'TRUENAS_IP') | default('192.168.0.216', true) }}"
bikehub_k3s_channel: stable
# One-time recovery after the VM booted with a wrong clock; normally false.
bikehub_rotate_k3s_certificates: false
bikehub_tls_enabled: true
bikehub_tls_server_name: "{{ bikehub_hostname }}"
bikehub_tls_directory: /etc/nginx/bikehub-tls
bikehub_tls_name: bikehub_tls
bikehub_tls_key_path: "{{ bikehub_tls_directory }}/{{ bikehub_tls_name }}"
bikehub_tls_certificate_path: "{{ bikehub_tls_directory }}/{{ bikehub_tls_name }}.pub"
bikehub_tls_cache_directory: "{{ playbook_dir }}/../.local-pki"
bikehub_observability_enabled: true
bikehub_observability_namespace: bikehub-observability
bikehub_observability_config_directory: "{{ playbook_dir }}/../../observability/config"
bikehub_otlp_node_port: 30418
bikehub_prometheus_node_port: 30900
bikehub_loki_node_port: 31000
bikehub_tempo_node_port: 32000
bikehub_collector_image: otel/opentelemetry-collector-contrib:0.164.0
bikehub_prometheus_image: prom/prometheus:v3.15.1
bikehub_loki_image: grafana/loki:3.7.9
bikehub_tempo_image: grafana/tempo:3.1.1
bikehub_grafana_ssh_target: truenas_admin@truenas.local
bikehub_grafana_ssh_identity: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/truenas_admin"
bikehub_grafana_app_name: grafana
bikehub_grafana_certificate_id: 2
bikehub_grafana_provision_enabled: true
bikehub_grafana_truenas_url: https://truenas.local
bikehub_grafana_ca_certificate: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/truenas/pki/bikehub-ca.crt"
