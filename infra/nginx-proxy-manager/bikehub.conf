# NPM -> existing Proxy Host macdeath.duckdns.org -> Custom Locations.
# Location: /bikehub/
# Scheme: https; Forward Host: 192.168.0.49; Forward Port: 443.
# Keep Access List: Inherit from Proxy Host.
# Paste these directives into the location gear / custom configuration:
rewrite ^/bikehub/(.*)$ /$1 break;
proxy_ssl_server_name on;
proxy_ssl_name bikehub.local;

client_max_body_size 11m;
